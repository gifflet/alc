version: 1
# Chosen by probing PATH at `alc init` time (claude -> claude-code, gemini ->
# gemini, neither -> mock). mock is a free no-op for dry runs — swap in a real
# engine any time.
default_engine: claude-code

compute_tiers:
  standard:
    mock: "mock-small"
    claude-code: "claude-sonnet-4-6"
  deep:
    mock: "mock-large"
    claude-code: "claude-opus-4-8"

engines:
  mock:
    type: mock
  claude-code:
    type: claude-code
    binary: claude
    # clean_config: true  # skip the host project's .claude/ settings and hooks

# Behavioral knobs — defaults shown; uncomment a line to override:
# default_timeout_s: 1800   # engine per-turn kill timeout (seconds)
# plan_retries: 2           # corrective retries when a plan's JSON is malformed
# fanout_concurrency: 4     # parallel workers for `alc conduct --parallel`
# plan_tier: standard       # compute tier for Conductor planning turns

# Reusable named check sets a Blueprint may opt into via `check_set: <name>`.
# One set, everything the repo's CI gates on, so any Blueprint that points at
# it carries the same law CI enforces. Commands mirror .github/workflows/ci.yml
# — including the ruff PIN, because an unpinned local lint that can disagree
# with CI is the exact trap `alc init` now warns other projects about (D4).
worktree_provision:
  # uv's environment. Cloned rather than linked: `uv run` may sync it,
  # and a linked dir is shared across worktrees. Missing -> skipped.
  - clone: .venv
  # vitest writes its cache into node_modules/.vite, so a link would let every
  # worktree mutate the main tree's copy (link is read-only-safe ONLY). Clone
  # is copy-on-write on APFS — cheap despite the 269MB.
  - clone: ui/node_modules
  # docs-site's check only reads (content gate + tsc --noEmit): link is safe
  # and skips copying 457MB per worktree.
  - link: docs-site/node_modules

check_sets:
  project:
    # --extra ui: `uv run` re-syncs a cloned worktree venv, and a plain sync
    # drops the ui extra — tests/ui then fails on a missing fastapi. Learned
    # the hard way on this very repo.
    - name: test
      command: ["uv", "run", "--extra", "ui", "pytest", "-q"]
    - name: lint
      command: ["uvx", "ruff@0.15.21", "check", "src", "tests"]
    - name: ui-test
      shell: "cd ui && npx vitest run"
    - name: ui-typecheck
      # `tsc -b`, not `tsc --noEmit`: the bare solution-file check is blinder
      # than the build (noUnusedLocals lives in the referenced configs), so a
      # demand's gate passed code the build then rejected (round 11, finding
      # 47). Checks are law only when they see what the build sees.
      shell: "cd ui && npx tsc -b"
    - name: docs-lint
      shell: "cd docs-site && npm run lint"

  security:
    []
    # - name: pip-audit
    #   command: ["pip-audit"]
    # - name: gitleaks
    #   command: ["gitleaks", "detect"]

blueprints_dir: .alc/blueprints
flows_dir: .alc/flows
queue_dir: .alc/queue
specialists_dir: .alc/specialists
