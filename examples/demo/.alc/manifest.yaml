version: 1
default_engine: mock

compute_tiers:
  standard:
    mock: "mock-small"
    claude-code: "claude-sonnet-4-6"
    gemini: "gemini-2.5-flash"
  deep:
    mock: "mock-large"
    claude-code: "claude-opus-4-8"
    gemini: "gemini-2.5-pro"

engines:
  mock:
    type: mock
  claude-code:
    type: claude-code
    binary: claude
  gemini:
    type: gemini
    binary: gemini

blueprints_dir: .alc/blueprints
flows_dir: .alc/flows
