[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alc"
version = "0.27.0"
description = "ALC — Agentic Layer Compiler & Runtime: a control plane for agentic coding."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ui = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "watchfiles>=0.21",
    # WebSocket implementation for uvicorn — without it a WS upgrade to /ws is
    # downgraded to HTTP and answered by the SPA fallback (a 200, not a 101).
    "websockets>=12",
]

[project.scripts]
alc = "alc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/alc"]
# The built frontend is gitignored (produced by `npm run build:alc` in ui/),
# but must ship inside the wheel — `artifacts` includes VCS-ignored paths.
artifacts = ["src/alc/ui/static/"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
