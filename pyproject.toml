[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# DISTRIBUTION name (PyPI): the bare `alc` was rejected as too similar to an
# existing project. The import package and the CLI command are still `alc`.
name = "alc-runtime"
version = "0.44.2"
description = "ALC — a control plane for agentic coding: automated checks and quality gates around your agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "gifflet" }]
requires-python = ">=3.12"
keywords = ["agents", "agentic", "coding", "control-plane", "claude-code", "gemini", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/gifflet/alc"
Repository = "https://github.com/gifflet/alc"
Issues = "https://github.com/gifflet/alc/issues"

[project.optional-dependencies]
ui = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "watchfiles>=0.21",
    # WebSocket implementation for uvicorn — without it a WS upgrade to /ws is
    # downgraded to HTTP and answered by the SPA fallback (a 200, not a 101).
    "websockets>=12",
]

[project.scripts]
alc = "alc.cli:main"

# The built frontend is gitignored (produced by `npm run build:alc` in ui/),
# but must ship in BOTH sdist and wheel — `uv build` builds the wheel from the
# sdist, so a wheel-only `artifacts` entry would silently drop the UI.
[tool.hatch.build]
artifacts = ["src/alc/ui/static/"]

[tool.hatch.build.targets.wheel]
packages = ["src/alc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
