# CI — lint + tests for the control plane (Python), the web IDE (ui/) and the
# documentation site (docs-site/).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Lint (ruff)
        run: uvx ruff@0.15.21 check src tests
      - name: Sync (with ui extra)
        run: |
          # --locked turns a stale lock into a red build instead of the silent
          # regeneration that let the lock drift across three branches.
          #
          # uv's own error already names the fix ("run `uv lock`"), but it is
          # buried in step logs. ::error surfaces it as a GitHub annotation, on
          # the PR and at the top of the run, where someone actually looks.
          if ! uv sync --extra ui --locked; then
            echo "::error title=uv.lock is out of sync::pyproject.toml changed without the lock. Run 'uv lock' locally and commit uv.lock."
            exit 1
          fi
      - name: Tests
        run: uv run pytest -q

  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        run: npm ci
      - name: Tests
        run: npx vitest run
      - name: Typecheck + build
        run: npm run build

  docs:
    name: Docs site (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run lint
      # The installers are served from this site and piped straight into a
      # stranger's shell. A syntax error ships as a broken install command on the
      # landing page, so parse both before anything else can.
      - name: Installer scripts parse
        run: |
          sh -n scripts-dist/install.sh
          pwsh -NoProfile -Command '
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path scripts-dist/install.ps1), [ref]$null, [ref]$errors)
            if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
            Write-Host "install.ps1 parses"'
      - name: Build
        run: npm run build
