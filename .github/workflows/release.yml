# Release — automatic on main: when pyproject.toml's version has no matching
# tag yet, run the full test suite, build the frontend into the package
# (src/alc/ui/static/), publish to PyPI (Trusted Publishing, no token), and cut a
# GitHub Release (tag v<version>) with the sdist + wheel attached. Version bumps
# land in feature commits, so merging a bumped main is what cuts a release.
#
# PyPI publish uses OIDC Trusted Publishing — configure a publisher on PyPI once
# (Publishing → owner: gifflet, repo: alc, workflow: release.yml) so no token is
# stored here. It runs BEFORE the GitHub Release so a publish failure leaves the
# tag uncreated and the run re-runnable.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write # PyPI Trusted Publishing (OIDC) — no long-lived token

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are needed to detect already-released versions

      - name: Detect unreleased version
        id: version
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION already released — nothing to do."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v5
        if: steps.version.outputs.released == 'false'
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        if: steps.version.outputs.released == 'false'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Backend tests
        if: steps.version.outputs.released == 'false'
        run: |
          # --locked turns a stale lock into a red build instead of the silent
          # regeneration that let the lock drift across three branches.
          #
          # uv's own error already names the fix ("run `uv lock`"), but it is
          # buried in step logs. ::error surfaces it as a GitHub annotation, on
          # the PR and at the top of the run, where someone actually looks.
          if ! uv sync --extra ui --locked; then
            echo "::error title=uv.lock is out of sync::pyproject.toml changed without the lock. Run 'uv lock' locally and commit uv.lock."
            exit 1
          fi
          uv run pytest -q

      - name: Frontend tests + build into the package
        if: steps.version.outputs.released == 'false'
        working-directory: ui
        run: |
          npm ci
          npx vitest run
          npm run build:alc

      - name: Build sdist + wheel (UI embedded)
        if: steps.version.outputs.released == 'false'
        run: |
          uv build
          # Guard: a release without the web IDE inside is a broken release.
          python3 - <<'EOF'
          import glob, sys, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          if not any("/ui/static/" in n for n in names):
              sys.exit("wheel has no ui/static files")
          EOF

      - name: Publish to PyPI (Trusted Publishing)
        if: steps.version.outputs.released == 'false'
        run: uv publish

      - name: Create GitHub Release
        if: steps.version.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" dist/* \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes

      # The docs site renders /changelog from the GitHub Releases API, and Vercel
      # builds on push — which happens minutes BEFORE the release above exists.
      # Without this the site is built against a release that is not there yet,
      # and the new version only appears on the next ISR revalidation, up to an
      # hour later. Rebuild now that there is something to read.
      #
      # No secret configured -> skipped, not failed: a fork has no hook and this
      # is not a reason to fail a release that already published.
      - name: Rebuild the docs site now the release exists
        if: steps.version.outputs.released == 'false'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL not set — skipping the docs rebuild."
            echo "The changelog will pick this release up on its next revalidation (up to 1h)."
            exit 0
          fi
          curl -sS -X POST "$HOOK" -o /dev/null -w 'deploy hook: HTTP %{http_code}\n'
